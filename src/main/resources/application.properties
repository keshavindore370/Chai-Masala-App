# 1. Database Connection (MongoDB)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/chai_masala_db}

# 2. Server Port (dynamically bound to Render PORT if set)
server.port=${PORT:8080}

# 3. Google OAuth2 Settings (Remove quotes and semicolons!)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_ACTUAL_ID_WITHOUT_QUOTES}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_ACTUAL_SECRET_WITHOUT_QUOTES}
spring.security.oauth2.client.registration.google.scope=profile,email

# 4. Security & Debugging
logging.level.org.springframework.security=DEBUG
