# 1. Database Connection (MongoDB)
# Make sure this port matches your custom Mongo port# Wapas default port par
spring.data.mongodb.uri=mongodb://localhost:27017/chai_masala_db

# 2. Server Port
server.port=8080

# 3. Google OAuth2 Settings (Remove quotes and semicolons!)
spring.security.oauth2.client.registration.google.client-id=YOUR_ACTUAL_ID_WITHOUT_QUOTES
spring.security.oauth2.client.registration.google.client-secret=YOUR_ACTUAL_SECRET_WITHOUT_QUOTES
spring.security.oauth2.client.registration.google.scope=profile,email

# 4. Security & Debugging
logging.level.org.springframework.security=DEBUG
# Tip: Don't use both .port and .uri. URI is enough.