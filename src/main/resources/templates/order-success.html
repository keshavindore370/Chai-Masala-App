<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | Chai Maslaa</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-glow: #fdfaf5;
            --primary-brown: #3e2723;
            --accent-orange: #d2691e;
            --success-glow: #a7c0a5;
        }

        body {
            background: radial-gradient(circle at center, #fdfaf5 0%, #e9dcc9 100%);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Animated Floating Bubbles in Background */
        .bubble {
            position: absolute;
            background: rgba(210, 105, 30, 0.05);
            border-radius: 50%;
            z-index: -1;
            animation: float 10s infinite ease-in-out;
        }

        .success-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            padding: 60px 40px;
            border-radius: 50px;
            box-shadow: 0 40px 100px rgba(62, 39, 35, 0.1);
            max-width: 480px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            position: relative;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* The Success Glow Icon */
        .icon-box {
            width: 120px;
            height: 120px;
            background: white;
            color: var(--success-glow);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            margin: 0 auto 30px;
            box-shadow: 0 0 30px rgba(167, 192, 165, 0.5);
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(167, 192, 165, 0.7); }
            70% { box-shadow: 0 0 0 30px rgba(167, 192, 165, 0); }
            100% { box-shadow: 0 0 0 0 rgba(167, 192, 165, 0); }
        }

        h1 {
            color: var(--primary-brown);
            font-size: 2.2rem;
            margin-bottom: 10px;
            letter-spacing: -1px;
            font-weight: 600;
        }

        p {
            color: #8d6e63;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 40px;
        }

        .order-badge {
            background: #fff3e0;
            color: var(--accent-orange);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 30px;
            border: 1px solid rgba(210, 105, 30, 0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-glow {
            background: var(--primary-brown);
            color: white;
            padding: 18px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: 0.4s;
            box-shadow: 0 10px 30px rgba(62, 39, 35, 0.2);
            width: 100%;
            box-sizing: border-box;
        }

        .btn-glow:hover {
            transform: translateY(-5px);
            background: var(--accent-orange);
            box-shadow: 0 15px 35px rgba(210, 105, 30, 0.3);
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #bc8e5e;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .back-link:hover {
            color: var(--primary-brown);
            transform: translateX(-5px);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.1); }
        }
    </style>
</head>
<body>

<div class="bubble" style="width: 250px; height: 250px; top: -50px; left: -50px;"></div>
<div class="bubble" style="width: 180px; height: 180px; bottom: 20px; right: -30px;"></div>

<div class="success-card">
    <div class="icon-box">
        <i class="fas fa-check"></i>
    </div>

    <span class="order-badge">✨ Order Confirmed</span>

    <h1>Order Successfully Placed!</h1>

    <p>
        Thank you for choosing <strong>Chai Maslaa</strong>. <br>
        Your premium spice blend is being prepared for dispatch. Get ready for the authentic taste of Indore!
    </p>

    <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        <a href="/admin/orders" class="btn-glow">
            <i class="fas fa-truck"></i> Track Your Shipment
        </a>

        <a href="/" class="back-link">
            <i class="fas fa-arrow-left" style="font-size: 12px; margin-right: 8px;"></i>
            Back to Home
        </a>
    </div>
</div>

</body>
</html>
