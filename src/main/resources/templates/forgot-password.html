<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password | Chai Maslaa</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4e9d8; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .reset-container { background: #ffffff; padding: 40px; border-radius: 30px; box-shadow: 0 15px 35px rgba(62, 39, 35, 0.1); width: 100%; max-width: 400px; text-align: center; }
        .logo-login { font-size: 1.8rem; font-weight: 600; color: #3e2723; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        h2 { color: #3e2723; margin-bottom: 10px; }
        .input-group { text-align: left; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; background: #fffdf9; margin-top: 5px; }
        .reset-btn { background: #d2691e; color: white; border: none; width: 100%; padding: 14px; border-radius: 25px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .reset-btn:hover { background: #3e2723; transform: translateY(-2px); }
        .info-msg { background: #fff3e0; color: #d2691e; padding: 12px; border-radius: 15px; font-size: 13px; margin-bottom: 20px; border: 1px solid #ffe0b2; }
    </style>
</head>
<body>
<div class="reset-container">
    <h2>Reset Password</h2>
    <p id="instruction" style="font-size: 13px; color: #6d4c41;">Enter mobile to receive OTP</p>

    <div id="step1">
        <div class="input-group">
            <input type="text" id="mobile" placeholder="Enter 10 digit mobile" required>
        </div>
        <button type="button" class="reset-btn" onclick="sendOtp()">Send OTP</button>
    </div>

    <div id="step2" style="display: none; margin-top: 20px;">
        <div class="input-group">
            <label style="font-size: 12px; font-weight: 600;">Enter 6-digit OTP</label>
            <input type="text" placeholder="X X X X X X" maxlength="6" style="letter-spacing: 5px; text-align: center;">
        </div>
        <div class="input-group">
            <label style="font-size: 12px; font-weight: 600;">New Password</label>
            <input type="password" name="newPassword" placeholder="Set New Password">
        </div>
        <button type="submit" class="reset-btn">Update Password & Login</button>
    </div>

    <div style="margin-top: 20px;">
        <a href="/login" style="color: #d2691e; text-decoration: none; font-size: 13px;">Back to Login</a>
    </div>
</div>

<script>
    function sendOtp() {
        // Animation effect
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
        document.getElementById('instruction').innerText = "OTP sent to your mobile! ✅";
        document.getElementById('instruction').style.color = "green";
    }
</script>
</body>
</html>
