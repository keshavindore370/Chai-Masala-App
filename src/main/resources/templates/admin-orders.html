<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Track Your Order | Chai Masala</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #d2691e; --dark: #3e2723; --cream: #fdfaf5; }
        body { background-color: var(--cream); font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; width: 90%; max-width: 800px; padding: 40px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.05); text-align: center; border-top: 8px solid var(--primary); }
        header h1 { font-family: 'Playfair Display', serif; color: var(--dark); margin: 10px 0; }

        /* Progress Table */
        .order-info { width: 100%; border-collapse: collapse; margin: 30px 0; background: #fffdfa; border-radius: 10px; overflow: hidden; }
        .order-info th { background: var(--primary); color: white; padding: 12px; font-size: 13px; }
        .order-info td { padding: 15px; border: 1px solid #f0e6d6; color: var(--dark); font-weight: 500; }

        /* Stepper Logic */
        .stepper { display: flex; justify-content: space-between; margin: 40px 0; position: relative; }
        .stepper::before { content: ''; position: absolute; top: 15px; left: 0; width: 100%; height: 2px; background: #e0e0e0; z-index: 1; }
        .step { z-index: 2; text-align: center; width: 25%; }
        .step-circle { width: 32px; height: 32px; background: #e0e0e0; border-radius: 50%; margin: 0 auto 10px; border: 4px solid white; display: flex; align-items: center; justify-content: center; transition: 0.4s; }
        .step.active .step-circle { background: var(--primary); color: white; box-shadow: 0 0 10px rgba(210, 105, 30, 0.4); }
        .step p { font-size: 12px; color: #888; }
        .step.active p { color: var(--primary); font-weight: 600; }

        .back-btn { text-decoration: none; color: var(--primary); font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <i class="fas fa-check-circle" style="color: #2e7d32; font-size: 3rem;"></i>
        <h1>Order Tracking</h1>
        <p style="color: #8d6e63;">Order ID: <span th:text="${order?.id}">#XYZ123</span></p>
    </header>

    <table class="order-info">
        <thead>
        <tr>
            <th>Customer</th>
            <th>Product</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td th:text="${order?.customerName}">User</td>
            <td th:text="${order?.productName}">Chai Masala</td>
            <td th:text="${order?.status}" style="color: #2e7d32; font-weight: 700;">PLACED</td>
        </tr>
        </tbody>
    </table>

    <div class="stepper">
        <div class="step" th:classappend="${order?.status == 'PLACED' || order?.status == 'SHIPPED' || order?.status == 'DELIVERED'} ? 'active'">
            <div class="step-circle"><i class="fas fa-box"></i></div>
            <p>Placed</p>
        </div>
        <div class="step" th:classappend="${order?.status == 'SHIPPED' || order?.status == 'DELIVERED'} ? 'active'">
            <div class="step-circle"><i class="fas fa-truck"></i></div>
            <p>Shipped</p>
        </div>
        <div class="step">
            <div class="step-circle"><i class="fas fa-map-marker-alt"></i></div>
            <p>In Transit</p>
        </div>
        <div class="step" th:classappend="${order?.status == 'DELIVERED'} ? 'active'">
            <div class="step-circle"><i class="fas fa-home"></i></div>
            <p>Delivered</p>
        </div>
    </div>

    <a href="/" class="back-btn">← Continue Shopping</a>
</div>

</body>
</html>
