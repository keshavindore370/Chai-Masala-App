<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register | Chai Maslaa</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4e9d8; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-card { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .logo { font-size: 1.8rem; font-weight: 600; color: #3e2723; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; }
        .reg-btn { background: #d2691e; color: white; border: none; width: 100%; padding: 14px; border-radius: 25px; cursor: pointer; font-weight: 600; margin-top: 15px; transition: 0.3s; }
        .reg-btn:hover { background: #3e2723; transform: translateY(-2px); }
        a { color: #d2691e; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="register-card">
    <div class="logo"><i class="fas fa-mug-hot" style="color: #d2691e;"></i> Chai Maslaa</div>
    <h2>Create Account</h2>
    <p style="color: #6d4c41;">Join our community of chai lovers</p>

    <form th:action="@{/register}" method="post">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="text" name="mobileNumber" placeholder="Mobile Number" required>
        <input type="password" name="password" placeholder="Create Password" required>
        <button type="submit" class="reg-btn">Sign Up</button>
    </form>

    <p style="margin-top: 20px; font-size: 14px; color: #6d4c41;">
        Already have an account? <a href="/login">Login here</a>
    </p>
</div>
</body>
</html>
